name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            platform: mac
            cmd: npm run dist:mac
          - os: ubuntu-24.04
            platform: linux
            cmd: npm run dist:linux
          - os: windows-latest
            platform: win
            cmd: npm run dist:win
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: app
    env:
      # Unsigned open-source builds: never fail searching for Apple/Microsoft paid signing certs.
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: ${{ matrix.cmd }}
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: |
            app/release/*.dmg
            app/release/*.zip
            app/release/*.AppImage
            app/release/*.deb
            app/release/*.exe
          if-no-files-found: error

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Generate SHA256 checksums
        working-directory: artifacts
        run: sha256sum * > SHA256SUMS.txt
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: artifacts/*
          body: |
            ## Sienna ${{ github.ref_name }}

            > **Note on code signing:** Sienna is a free, open-source project and is **not code-signed** (no paid Apple Developer or Microsoft Authenticode certificate).
            >
            > - **macOS via Homebrew (recommended):**
            >   ```sh
            >   brew tap lajoonpark/sienna https://github.com/lajoonpark/Sienna
            >   brew install --cask sienna
            >   ```
            >   The Homebrew Cask automatically runs `xattr -dr com.apple.quarantine /Applications/Sienna.app` so macOS allows Sienna to open.
            > - **macOS manual download (`.dmg` / `.zip`):** Drag `Sienna.app` to `/Applications`, then run:
            >   ```sh
            >   xattr -dr com.apple.quarantine /Applications/Sienna.app
            >   ```
            > - **Windows:** Click **More info → Run anyway** on the Windows SmartScreen prompt.
            > - **Linux:** Make the `.AppImage` executable (`chmod +x Sienna-*.AppImage`) or install the `.deb` package.
