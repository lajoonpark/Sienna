<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- Content Security Policy: only the app's own scripts run, and pictures/fetches only reach YouTube Music's image
     hosts (see src/arturl.js). 'unsafe-inline' styles: the page builds its CSS at run time. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob: https://*.googleusercontent.com https://*.ggpht.com https://*.ytimg.com; connect-src 'self' data: blob: https://*.googleusercontent.com https://*.ggpht.com https://*.ytimg.com; worker-src 'self' blob: data:; media-src 'self' data: blob:; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sienna mini</title>
<style>
  :root { --cs-bottom: 40px; } /* the search slips stop inside the card */
  html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; user-select: none; }
  /* the window is the stage; in a plain browser the stage is a small box in the middle of a fake desktop */
  #stage { position: relative; width: 100vw; height: 100vh; }
  body.preview { background: #6f7f8f; }
  body.preview #stage { width: var(--w); height: var(--h); position: absolute; left: 50%; top: 50%; margin: calc(var(--h) / -2) 0 0 calc(var(--w) / -2); }
  canvas { display: block; width: 100%; height: 100%; filter: drop-shadow(0 5px 9px rgba(60, 40, 30, .32)); }
</style>
</head>
<body>
<div id="stage"></div>
<script type="module" src="/src/mini.js"></script>
</body>
</html>
